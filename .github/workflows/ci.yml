name: CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - name: Deploy on VPS
        run: |
          cd /root/CloudSystemen-project1
          git pull
          docker compose down
          docker compose build --no-cache
          docker compose up -d