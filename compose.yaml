services:
  node_app:
    build: .
    container_name: node_app
    ports:
      - "3000:3000"
    restart: always

  caddy:
    image: caddy:latest
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - node_app
    restart: always

volumes:
  caddy_data:
  caddy_config: