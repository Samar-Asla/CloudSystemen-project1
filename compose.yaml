services:
  node_app:
    build: .
    container_name: node_app
    ports:
      - "3000:3000"
    networks:
      - app_network

  caddy:
    image: caddy:latest
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      - node_app 
    networks:
      - app_network

networks:
  app_network:
